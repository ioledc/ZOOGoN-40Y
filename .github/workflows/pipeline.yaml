---
name: ZooGon Kobo Automation

on:
  push:
  schedule:
    - cron: "0 0 * * SUN"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
  KOBO_ASSET_ID: ${{ secrets.KOBO_ASSET_ID }}
  KOBO_USERNAME: ${{ secrets.KOBO_USERNAME }}
  KOBO_PASSWORD: ${{ secrets.KOBO_PASSWORD }}
  SHAREPOINT_CLIENT_ID: ${{ secrets.SHAREPOINT_CLIENT_ID }}
  SHAREPOINT_TENANT_ID: ${{ secrets.SHAREPOINT_TENANT_ID }}
  SHAREPOINT_CLIENT_SECRET: ${{ secrets.SHAREPOINT_CLIENT_SECRET }}

jobs:
  build-container:
    name: Build R container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ghcr.io/ioledc/zoogon-40y/r-runner-zoogon-mc:latest
          cache-from: type=registry,ref=ghcr.io/ioledc/zoogon-40y/r-runner-zoogon-mc:buildcache
          cache-to: type=registry,ref=ghcr.io/ioledc/zoogon-40y/r-runner-zoogon-mc:buildcache,mode=max

  ingest-kobo-surveys:
    name: Ingest MC kobo surveys
    needs: build-container
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ioledc/zoogon-40y/r-runner-zoogon-mc:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call ingest_surveys()
        run: Rscript -e 'ZooGoN::ingest_surveys()'

  process-kobo-surveys:
    name: Process MC kobo surveys
    needs: ingest-kobo-surveys
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ioledc/zoogon-40y/r-runner-zoogon-mc:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call preprocess_surveys()
        run: Rscript -e 'ZooGoN::preprocess_surveys()'

  merge-data:
    name: Merge legacy and ongoing data
    needs: process-kobo-surveys
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ioledc/zoogon-40y/r-runner-zoogon-mc:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call format_to_tidy()
        run: Rscript -e 'ZooGoN::format_to_tidy()'

  build-darwincore-archive:
    name: Build Darwin Core Archive
    needs: merge-data
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ioledc/zoogon-40y/r-runner-zoogon-mc:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call format_to_DC_archive()
        run: Rscript -e 'ZooGoN::format_to_DC_archive()'
    
  render-report:
    name: Render MC survey report
    needs: merge-data
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ioledc/zoogon-40y/r-runner-zoogon-mc:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call render_report()
        run: Rscript -e 'ZooGoN::render_report()'
      - name: List files in /home
        run: ls -la /home/ZooGoN-report-*
      - name: Upload report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZooGoN-report-${{ github.run_id }}
          path: /home/ZooGoN-report-*.html
          retention-days: 90