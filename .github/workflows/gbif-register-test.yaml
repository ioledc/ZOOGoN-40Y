---
name: GBIF Test Registration

on:
  schedule:
    # Runs on the 1st of every month at midnight UTC.
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  GBIF_TEST_ENDPOINT_URL: ${{ secrets.GBIF_TEST_ENDPOINT_URL }}
  GBIF_TEST_USER: ${{ secrets.GBIF_TEST_USER }}
  GBIF_TEST_PASSWORD: ${{ secrets.GBIF_TEST_PASSWORD }}
  GBIF_TEST_ORG_KEY: ${{ secrets.GBIF_TEST_ORG_KEY }}
  GBIF_TEST_INSTALL_KEY: ${{ secrets.GBIF_TEST_INSTALL_KEY }}

jobs:
  register-gbif-test:
    name: Register dataset on GBIF-Test
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ioledc/zoogon-40y/r-runner-zoogon-mc:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Call register_gbif_dataset_test()
        run: Rscript -e 'ZooGoN::register_gbif_dataset_test()'
