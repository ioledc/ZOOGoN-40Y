url: https://ioledc.github.io/ZOOGoN-40Y/
template:
  bootstrap: 5
  bslib:
    primary: "#0066cc"
    secondary: "#6c757d"

home:
  title: ZooGoN • Gulf of Naples Zooplankton Biodiversity
  description: >
    Standardizes taxonomic names in Mediterranean zooplankton datasets from 
    40 years of monitoring (1984-2024) at LTER-MareChiara station. Part of 
    the EU DTO-BioFlow project for the Digital Twin of the Ocean.
  
navbar:
  title: "ZooGoN"
  type: default
  left:
    - icon: fa-home fa-lg
      href: index.html
    - text: "Reference"
      href: reference/
    - text: "Articles"
      menu:
        - text: "Data Processing Workflow"
          href: articles/data-processing.html
        - text: "Darwin Core Integration"  
          href: articles/darwin-core.html
    - text: "News"
      href: news/
  right:
    - icon: fa-github fa-lg
      href: https://github.com/ioledc/ZOOGoN-40Y
    - icon: fa-globe fa-lg
      href: https://dto-bioflow.eu

reference:
  - title: "Survey Data Ingestion"
    desc: "KoboToolbox integration for field survey data collection"
    contents:
      - ingest_surveys
      - get_kobo_data
      - preprocess_surveys

  - title: "Legacy Data Ingestion"
    desc: "Download, validate, and harmonize legacy zooplankton datasets"
    contents:
      - ingest_legacy_84_15
      - ingest_legacy_16_20

  - title: "Data Processing"
    desc: "Merge, harmonize, and convert zooplankton data"
    contents:
      - format_to_tidy
      - tidy_to_wide
      - format_to_dc
      - build_emof_occurrence
      - build_emof_events

  - title: "Cloud Storage"
    desc: "SharePoint integration for data storage and retrieval"
    contents:
      - upload_sharepoint_df
      - upload_sharepoint_file
      - download_sharepoint_file

  - title: "Pipeline & Reporting"
    desc: "Orchestrate the full pipeline and render monitoring reports"
    contents:
      - run_pipeline
      - render_report

  - title: "Utility Functions"
    desc: "Helper functions for data processing"
    contents:
      - reshape_kobo_repeat
      - add_version
      - read_config
      - load_dotenv

  - title: "Publishing"
    desc: "Build and register Darwin Core Archives"
    contents:
      - format_to_DC_archive
      - register_gbif_dataset
      - register_gbif_dataset_test
      - add_gbif_license_block

articles:
  - title: "Getting Started"
    navbar: "Getting Started"
    contents:
      - data-processing
      - darwin-core

footer:
  structure:
    left: [developed_by, built_with, legal]
    right: [funding]
  components:
    funding: >
      <p>Funded by the EU DTO-BioFlow project (HORIZON-MISS-2022-OCEAN-01-07) 
      under the Mission "Restore our Ocean & Waters by 2030"</p>
    legal: >
      <p>© 2025 Stazione Zoologica Anton Dohrn. 
      Licensed under <a href="https://www.gnu.org/licenses/gpl-3.0.html">GPL-3</a>.</p>
