default:
  ingestion:
    kobo:
      asset_id: !expr Sys.getenv('KOBO_ASSET_ID')
      username: !expr Sys.getenv('KOBO_USERNAME')
      password: !expr Sys.getenv('KOBO_PASSWORD')
      token: !expr Sys.getenv('KOBO_TOKEN')
    surveys:
      raw:
        file_prefix: "raw-surveys"
      preprocessed:
        file_prefix: "preprocessed-surveys"
      darwincore:
        file_prefix: "dc-formatted-surveys"
    tidy_data:
      file_prefix: "tidy-data"
    wide_data:
      file_prefix: "wide-data"
    reports:
      file_prefix: "interactive-report"
  storage:
    sharepoint:
      buckets:
        automation_bucket: zoogon_mc-dev
        legacy_bucket: legacy_data
        legacy_bucket_processed: legacy_data_processed
        unmatched_bucket: worms_unmatched
        darwin_core_bucket: darwincore_archives
        reports_bucket: reports
      credentials:
        site_url: "https://sznit.sharepoint.com/sites/BioFlow-ZOOGoN-40Y"
        client_id: !expr Sys.getenv('SHAREPOINT_CLIENT_ID')
        tenant_id: !expr Sys.getenv('SHAREPOINT_TENANT_ID')
        client_secret: !expr Sys.getenv('SHAREPOINT_CLIENT_SECRET')

  gbif:
    test:
      base_url: "https://api.gbif-test.org/v1"
      endpoint_url: !expr Sys.getenv('GBIF_TEST_ENDPOINT_URL')
      username: !expr Sys.getenv('GBIF_TEST_USER')
      password: !expr Sys.getenv('GBIF_TEST_PASSWORD')
      organization_key: !expr Sys.getenv('GBIF_TEST_ORG_KEY')
      installation_key: !expr Sys.getenv('GBIF_TEST_INSTALL_KEY')
    production:
      base_url: "https://api.gbif.org/v1"
      endpoint_url: !expr Sys.getenv('GBIF_ENDPOINT_URL')
      username: !expr Sys.getenv('GBIF_USERNAME')
      password: !expr Sys.getenv('GBIF_PASSWORD')
      organization_key: !expr Sys.getenv('GBIF_ORG_KEY')
      installation_key: !expr Sys.getenv('GBIF_INSTALL_KEY')

production:
  storage:
    sharepoint:
      buckets:
        automation_bucket: zoogon_mc-prod
